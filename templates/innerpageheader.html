<section class="relative bg-white pt-12 pb-8 sm:pt-16 sm:pb-12 px-4 sm:px-6 lg:px-8 border-b border-gray-100">
  <!-- Soft Background Glow -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-3/4 h-32 bg-gradient-to-r from-emerald-100/40 via-orange-100/30 to-emerald-100/40 blur-3xl opacity-70"></div>
  </div>

  <div class="relative max-w-4xl mx-auto text-center flex flex-col items-center">
    
    <!-- Category / Tag Badge -->
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-50 border border-emerald-200/80 text-emerald-700 text-xs font-bold uppercase tracking-widest mb-4 shadow-sm">
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      XtopTitle <!-- Dynamic Tag (e.g., Company, Legal, Account) -->
    </div>

    <!-- Page Title -->
    <h1 class="text-3xl sm:text-5xl font-black text-slate-900 uppercase tracking-tight leading-tight">
      Xtitle <span class="text-orange-500">Xsubtitle</span>
    </h1>

    <!-- Page Subtitle / Brief Description -->
    <p class="mt-3 max-w-xl text-sm sm:text-base text-gray-500 font-normal leading-relaxed">
      XsmallText
    </p>

  </div>
</section>
