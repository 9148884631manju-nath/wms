 <!-- CATEGORY CARD (Place inside your loop) -->
<div class="group relative block h-64 z-0 overflow-hidden rounded-2xl bg-slate-900 shadow-sm border border-slate-100">
  
  <!-- Category Link & Visual Content -->
  <a href="Xlink" class="block w-full h-full">
    <img src="Xidtitle" 
         alt="Xtitle" 
         class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-110 opacity-85 group-hover:opacity-100">
    
    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-950/20 to-transparent"></div>
    
    <div class="absolute bottom-0 p-5 w-full flex items-end justify-between z-10">
      <div>
        <span class="text-[10px] font-bold text-orange-400 uppercase tracking-widest">Xscat</span>
        <h3 class="text-lg font-bold text-white uppercase tracking-wider">Xtitle</h3>
      </div>
      <span class="w-8 h-8 rounded-full bg-white/20 backdrop-blur-md text-white flex items-center justify-center transition-all group-hover:bg-orange-500 group-hover:scale-110">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </span>
    </div>
  </a>

  <!-- Admin Controls (Overlay on Top Right) -->
  <div class="absolute top-3 right-3 z-20 flex items-center gap-1.5 opacity-90 group-hover:opacity-100 transition-opacity">
    
    <!-- Edit Button (Triggers Modal) -->
    <button hx-get="admin-cat-curd.php?par=Xpage&id=Xeid&gg=update&title=Xtitle&link=Xlink"
            hx-target="#modal-container"
            hx-swap="innerHTML"
            title="Edit Category"
            class="w-8 h-8 rounded-full bg-white/80 hover:bg-white text-slate-800 backdrop-blur-md flex items-center justify-center shadow-md transition-all hover:scale-110 cursor-pointer">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
      </svg>
    </button>

    <!-- Delete Button -->
    <button hx-get="admin-cat-curd.php?par=Xpage&id=Xeid&gg=delete"
            hx-target="#modal-container"
            hx-swap="innerHTML"
            title="Delete Category"
            class="w-8 h-8 rounded-full bg-red-500/80 hover:bg-red-600 text-white backdrop-blur-md flex items-center justify-center shadow-md transition-all hover:scale-110 cursor-pointer">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
    </button>

  </div>

</div>
